version: "3.9"

services:
  postgres_vitaflow:
    image: postgres:15-alpine
    container_name: postgres_vitaflow
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: metodo4cs
    volumes:
      - postgres_vitaflow_data:/var/lib/postgresql/data
    ports:
      - "5441:5432"
    networks:
      - public

  redis_vitaflow:
    image: redis:7-alpine
    container_name: redis_vitaflow
    restart: always
    ports:
      - "6383:6379"
    networks:
      - public

  backend_vitaflow:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: backend_vitaflow
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://user:password@postgres_vitaflow:5432/metodo4cs?schema=public
      - REDIS_URL=redis://redis_vitaflow:6379
      - PORT=3001
      - NODE_ENV=development
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
      - ./.env:/.env
    networks:
      - public
    depends_on:
      - postgres_vitaflow
      - redis_vitaflow

  frontend_vitaflow:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: frontend_vitaflow
    restart: always
    ports:
      - "3005:3005"
    environment:
      - WATCHPACK_POLLING=true
      - BACKEND_HOST=backend_vitaflow
      - NEXT_PUBLIC_API_URL=http://backend_vitaflow:3001
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - public
    depends_on:
      - backend_vitaflow

volumes:
  postgres_vitaflow_data:

networks:
  public:
    external: true
